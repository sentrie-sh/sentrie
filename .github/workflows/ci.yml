name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pin to a v2.x that supports Go 1.25 (>= v2.4.0)
          version: v2.4.0
          args: >
            --timeout=5m
            --output.text.path=stdout
            --output.text.print-linter-name=true
            --output.text.print-issued-lines=true
            --output.text.colors=true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (race)
        timeout-minutes: 15
        env:
          GOMAXPROCS: 2
          GOMEMLIMIT: 6GiB
        run: |
          set -euo pipefail
          echo "## Running race tests..."
          timeout --signal=KILL --kill-after=2m 14m \
            go test -count=1 -race -timeout=10m -p=1 ./...

      - name: Run tests (coverage)
        if: success()
        timeout-minutes: 15
        env:
          GOMAXPROCS: 2
          GOMEMLIMIT: 6GiB
        run: |
          set -euo pipefail
          set +e
          timeout --signal=KILL --kill-after=1m 14m \
            go test -count=1 -covermode=atomic -coverprofile=coverage.out -timeout=10m -p=1 ./... 2>&1 | tee test_output.log
          code=${PIPESTATUS[0]}
          set -e
          if grep -q '^FAIL' test_output.log; then
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          # go test -coverprofile can exit 1 after merging packages even when all tests pass.
          if [ "$code" -eq 1 ] && [ -s coverage.out ]; then
            exit 0
          fi
          exit "$code"

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
