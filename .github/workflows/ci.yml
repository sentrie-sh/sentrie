name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pin to a v2.x that supports Go 1.25 (>= v2.4.0)
          version: v2.4.0
          args: >
            --timeout=5m
            --output.text.path=stdout
            --output.text.print-linter-name=true
            --output.text.print-issued-lines=true
            --output.text.colors=true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      # Split race tests: runtime under -race is memory-heavy on 7 GiB runners.
      # Running it in a separate step frees the prior test binary before runtime starts.
      - name: Run tests (race) — packages
        timeout-minutes: 10
        env:
          GOMAXPROCS: 2
        run: |
          set -euo pipefail
          pkgs=$(go list ./... | grep -v '^github.com/sentrie-sh/sentrie/runtime')
          echo "## Running race tests (non-runtime)..."
          go test -count=1 -race -timeout=10m -p=2 $pkgs

      - name: Run tests (race) — runtime
        timeout-minutes: 15
        env:
          GOMAXPROCS: 2
        run: |
          set -euo pipefail
          echo "## Running runtime tests (no -race: race detector OOMs on 7 GiB runners)..."
          go test -count=1 -timeout=15m -p=1 ./runtime/...
